name: CnK ValhallaMMO Bridge

on:
  push:
    paths:
      - 'integration/valhallammo-bridge/**'
      - '.github/workflows/cnk-valhallammo-bridge.yml'
  pull_request:
    paths:
      - 'integration/valhallammo-bridge/**'
      - '.github/workflows/cnk-valhallammo-bridge.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: integration/valhallammo-bridge/pom.xml
      - name: Build bridge
        run: mvn --batch-mode --no-transfer-progress -f integration/valhallammo-bridge/pom.xml verify
      - uses: actions/upload-artifact@v4
        with:
          name: cnk-valhallammo-bridge
          path: integration/valhallammo-bridge/target/cnk-valhallammo-bridge-*.jar
